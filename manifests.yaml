
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: memory-hog
          image: python:3.12-alpine
          command:
            - python
            - -u
            - -c
            - |
              import time

              print("Allocating 128 MiB...")
              data = bytearray(128 * 1024 * 1024)
              print("Memory allocated successfully")

              while True:
                  time.sleep(60)
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 48Mi
              cpu: 100m
