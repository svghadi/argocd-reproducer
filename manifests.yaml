apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-config-test
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: missing-config-test
  template:
    metadata:
      labels:
        app: missing-config-test
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Application started"
              sleep infinity
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database-host
